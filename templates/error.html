<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Name That Artist</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=Space+Grotesk:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 2rem;
            background: #160F1B;
            background-image: radial-gradient(120% 60% at 50% -10%, #2C1B3A 0%, transparent 60%);
            background-repeat: no-repeat;
            color: #F2EBE1;
            font-family: 'Space Grotesk', ui-sans-serif, system-ui, sans-serif;
        }
        .card { max-width: 32rem; }
        .eyebrow {
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            color: #8B7F9A;
            margin: 0 0 1rem;
        }
        h1 {
            font-family: 'Bricolage Grotesque', Georgia, serif;
            font-weight: 800;
            font-size: clamp(2.5rem, 9vw, 3.75rem);
            line-height: 0.95;
            letter-spacing: -0.03em;
            margin: 0 0 1rem;
        }
        p { color: #8B7F9A; margin: 0 0 2rem; }
        a {
            display: inline-block;
            font-weight: 700;
            font-size: 0.9375rem;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            color: #160F1B;
            background: #FFB627;
            border-radius: 10px;
            padding: 0.9rem 1.75rem;
            text-decoration: none;
        }
        a:focus-visible { outline: 2px solid #FFB627; outline-offset: 3px; }
    </style>
</head>
<body>
    <div class="card">
        <p class="eyebrow">Name that artist</p>
        <h1>The music stopped.</h1>
        <p>{{ message }}</p>
        <a href="/">Try again</a>
    </div>
</body>
</html>
